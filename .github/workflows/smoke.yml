name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# ยกเลิกรอบเก่าถ้ามี push ใหม่เข้ามาใน PR เดียวกัน
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: ตรวจกฎใน INVARIANTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ไม่ใช้ npm ci เพราะ repo นี้ไม่มี package-lock.json
      # (ตั้งใจ — แอปจริงไม่มี dependency, package.json มีไว้ให้ตัวเทสเท่านั้น)
      - name: ติดตั้ง dependency ของเทส
        run: npm install --no-audit --no-fund

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium

      - name: รัน smoke test
        run: npm test

      - name: เก็บผลไว้ดูตอน fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
