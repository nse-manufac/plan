name: Smoke tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# ยกเลิกรอบเก่าถ้ามี push ใหม่เข้ามาใน PR เดียวกัน
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ถ้าแก้ไฟล์แอปแล้วลืมบัมป์เวอร์ชัน เครื่องที่ค้างไฟล์เก่าไว้จะไม่มีทางรู้ว่ามีของใหม่
  # และเลขบนหน้าจอจะกลายเป็นคำโกหก ซึ่งอันตรายกว่าไม่มีเลขเลยเพราะทุกคนจะเชื่อมัน
  # กฎแบบนี้ถ้าไม่บังคับด้วยเครื่อง เดี๋ยวก็ลืม — ให้ CI เป็นคนจำแทน (INVARIANTS F4)
  version-bump:
    name: ตรวจว่าบัมป์ app-version แล้ว
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: เทียบเวอร์ชันกับ base branch
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"

          # นิยาม "ไฟล์แอป" อยู่ในสคริปต์ที่มีเทสคุม (tests/guard-app-files.test.sh)
          source .github/scripts/app-files.sh

          ver() { grep -o '<meta name="app-version" content="[^"]*"' | head -1 | sed 's/.*content="//; s/"$//'; }

          # แก้ .js ก็ต้องบัมป์ด้วย — ไม่งั้นเครื่องที่ค้างไฟล์เก่าจะเอา app.js ใหม่ไปคู่กับ core/ เก่า
          # ซึ่งพังเงียบกว่าเดิม เพราะแต่ละไฟล์หมดอายุแคชไม่พร้อมกัน (INVARIANTS F2 · F4)
          # ใช้ versioned_changed_files ไม่ใช่ app_changed_files — ตัวนี้รวม lib/ ด้วย
          # เปลี่ยนไลบรารี = เครื่องในโรงงานต้องโหลดใหม่ จึงต้องบังคับบัมป์เลขรุ่นเหมือนกัน
          APPCHANGED=$(versioned_changed_files "$BASE")

          if [ -z "$APPCHANGED" ]; then
            echo "PR นี้ไม่ได้แก้ไฟล์แอป — ข้ามการตรวจ"
            exit 0
          fi
          echo "ไฟล์แอปที่เปลี่ยน:"
          echo "$APPCHANGED" | sed 's/^/  /'
          echo ""

          # เลขรุ่นประกาศที่ <head> ของไฟล์ .html ที่รากไฟล์เดียว (F4 — ประกาศที่เดียว)
          # ถ้าวันหนึ่งมีหลายแอปในรากเดียวกัน ด่านนี้ต้องถูกเขียนใหม่
          # ให้มันแดงเองตอนนั้นดีกว่าเดาเงียบ ๆ ว่าไฟล์ไหนคือแอปหลัก
          COUNT=$(ls -1 *.html 2>/dev/null | wc -l)
          if [ "$COUNT" -ne 1 ]; then
            echo "::error::รากของ repo มีไฟล์ .html $COUNT ไฟล์ — ด่านนี้เขียนไว้สำหรับแอปเดียว ต้องแก้ด่านก่อนเพิ่มแอปที่สอง"
            exit 1
          fi
          APP=$(ls -1 *.html)

          NEW=$(ver < "$APP" || true)
          OLD=$(git show "$BASE:$APP" 2>/dev/null | ver || true)
          echo "── $APP"
          echo "   บน ${{ github.base_ref }} : ${OLD:-(ไม่พบ)}"
          echo "   ใน PR นี้        : ${NEW:-(ไม่พบ)}"

          if [ -z "$NEW" ]; then
            echo "::error file=$APP::ไม่พบ <meta name=\"app-version\"> ในไฟล์ — ผู้ใช้จะบอกไม่ได้ว่าเครื่องตัวเองรันรุ่นไหน (INVARIANTS F4)"
            exit 1
          fi
          if [ "$OLD" = "$NEW" ]; then
            echo "::error file=$APP::PR นี้แก้ไฟล์แอปแต่ไม่ได้บัมป์ app-version (ยังเป็น $NEW) — เครื่องที่ค้างไฟล์เก่าไว้จะไม่รู้ว่ามีของใหม่ (INVARIANTS F4)"
            exit 1
          fi
          echo "   ✓ บัมป์แล้ว: ${OLD:-(ไม่มี)} → $NEW"

  smoke:
    name: ตรวจกฎใน INVARIANTS.md
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      # เทสตรรกะของด่านตรวจ ไม่ต้องใช้เบราว์เซอร์ จึงรันก่อนติดตั้งอะไรทั้งนั้น
      # ล้มเร็วกว่ารอ playwright ติดตั้งเสร็จสามนาทีแล้วค่อยรู้ว่าด่านพัง
      - name: เทสตรรกะของด่านตรวจ
        run: bash tests/guard-rules.test.sh

      # ด่านที่ตัดสินจาก "ไฟล์ไหนคือไฟล์แอป" — สร้าง repo จำลองแล้วรันของจริงกับ PR สมมติ
      # ไม่ต้องใช้เบราว์เซอร์และไม่ต้องต่อเน็ต จึงรันก่อนติดตั้งอะไรเช่นกัน
      - name: เทสด่านไฟล์แอป
        run: bash tests/guard-app-files.test.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ไม่ใช้ npm ci เพราะ repo นี้ไม่มี package-lock.json
      # (ตั้งใจ — แอปจริงไม่มี dependency, package.json มีไว้ให้ตัวเทสเท่านั้น)
      - name: ติดตั้ง dependency ของเทส
        run: npm install --no-audit --no-fund

      # เทสกฎที่รันด้วย node ล้วน — ยังไม่มีสคริปต์ `test:core` จนกว่าจะแยก core/ ก้อนแรก
      # ใส่ --if-present ไว้ล่วงหน้า เพื่อให้ PR ที่แยกไฟล์ไม่ต้องมาแตะ .github/ อีก
      # (การแตะ .github/ ไปโดนด่านข้อ 1 ของ agent-guard ซึ่งบล็อก PR ของ agent ทันที)
      - name: เทสกฎด้วย node (ถ้ามี)
        run: npm run test:core --if-present

      - name: ติดตั้งเบราว์เซอร์
        run: npx playwright install --with-deps chromium

      - name: รัน smoke test
        run: npm test

      - name: เก็บผลไว้ดูตอน fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
