name: ด่านกัน agent ยกระดับสิทธิ์ตัวเอง

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# ═══════════════════════════════════════════════════════════════
# ภัยที่กันอยู่: PR ที่แก้ไฟล์ใน .github/ สามารถเปลี่ยนสิทธิ์ของ workflow,
# ปิดการตรวจ, หรือทำให้ secret หลุดในรอบถัดไปได้
#
# หมายเหตุสำคัญ: workflow ที่รันตอน pull_request คือเวอร์ชันใน PR นั้นเอง
# แปลว่า PR ที่ "ลบไฟล์นี้ทิ้ง" จะทำให้ job นี้ไม่รัน
# ตัวที่กันจริงจึงเป็น branch protection ที่ตั้ง job นี้เป็น required check —
# ถ้า check ไม่รายงานผล ปุ่ม merge จะไม่เขียวตลอดกาล
# ═══════════════════════════════════════════════════════════════

jobs:
  guard:
    name: ตรวจสิ่งที่ agent ห้ามแตะ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ตรวจไฟล์ที่เปลี่ยน
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD")

          echo "PR โดย: $PR_AUTHOR   branch: $HEAD_REF"
          echo "ไฟล์ที่เปลี่ยน:"
          echo "$CHANGED" | sed 's/^/  /'
          echo ""

          FAIL=0

          # ── 1. PR จาก agent ห้ามแตะ .github/ เด็ดขาด ──
          case "$HEAD_REF" in
            fix/*|claude/*)
              if echo "$CHANGED" | grep -q '^\.github/'; then
                echo "::error::PR จาก branch ของ agent ($HEAD_REF) แก้ไฟล์ใน .github/ — ไม่อนุญาตเด็ดขาด"
                echo "$CHANGED" | grep '^\.github/' | sed 's/^/::error::  แตะ: /'
                FAIL=1
              fi
              ;;
          esac

          # ── 2. ห้ามมี secret หลุดเข้ามาในทุก PR (repo นี้เป็น public) ──
          # ตรวจเฉพาะบรรทัดที่ "เพิ่มเข้ามา" เพื่อไม่ให้ของเก่าทำ PR ใหม่แดง
          ADDED=$(git diff "$BASE...HEAD" -- . ':(exclude)*.md' | grep '^+' || true)
          leak() {
            if printf '%s' "$ADDED" | grep -qE "$1"; then
              echo "::error::พบ $2 ในบรรทัดที่เพิ่มเข้ามา — repo นี้เป็น public"
              FAIL=1
            fi
          }
          leak 'AKfyc[A-Za-z0-9_-]{20,}'        'URL ของ Apps Script deployment'
          leak 'gh[pousr]_[A-Za-z0-9]{30,}'      'GitHub token'
          leak 'github_pat_[A-Za-z0-9_]{30,}'    'GitHub PAT'
          leak 'sk-ant-[A-Za-z0-9_-]{20,}'       'Anthropic API key'

          # ── 3. PR จาก agent ต้องเล็กพอที่จะรีวิวตอนพักเที่ยงได้ ──
          # prompt บอกช่างซ่อมไว้ว่าเกิน ~80 บรรทัดในไฟล์แอปให้หยุดถามเจ้าของก่อน
          # แต่นั่นเป็น "คำสั่ง" ซึ่ง agent เลือกไม่ทำตามได้ ด่านนี้คือเส้นที่เลือกไม่ได้
          # ตั้งไว้ 150 ไม่ใช่ 80 เพราะ 80 คือจุดที่ควรหยุดถาม ส่วน 150 คือจุดที่เลยเถิดแล้ว
          case "$HEAD_REF" in
            fix/*|claude/*)
              APPLINES=$(git diff --numstat "$BASE...HEAD" -- '*.html' | awk '{a+=$1; d+=$2} END {print (a+d)+0}')
              echo "บรรทัดที่เปลี่ยนในไฟล์แอป: $APPLINES"
              if [ "$APPLINES" -gt 150 ]; then
                echo "::error::PR จาก agent แก้ไฟล์แอปไป $APPLINES บรรทัด (เพดาน 150) — ใหญ่เกินกว่าจะตรวจตอนพักเที่ยง ต้องหยุดถามเจ้าของก่อนแก้ใหญ่ขนาดนี้"
                FAIL=1
              fi
              ;;
          esac

          # ── 4. ห้ามแตะบรรทัด vendor SheetJS (INVARIANTS F2) ──
          # ~800 KB จาก 990 KB ของไฟล์แอปคือ SheetJS ที่ vendor ไว้ในบรรทัดยาวมาก
          # ถ้าเครื่องมือ format หรือ agent เผลอแตะ diff จะบวมมหาศาลและแอปอาจพังแบบเงียบ ๆ
          # ตรวจจากความยาวบรรทัด ไม่ต้องรู้เลขบรรทัด — เลขเลื่อนได้ แต่ความยาวไม่โกหก
          # `|| true` จำเป็น — grep คืน 1 เมื่อไม่เจอ ซึ่งกับ set -e + pipefail จะทำให้ step ล้มทั้งที่ผลคือ "สะอาด"
          VENDORHIT=$(git diff -U0 "$BASE...HEAD" -- '*.html' | grep '^[+-]' | awk 'length($0)>20000' | wc -l || true)
          if [ "$VENDORHIT" -gt 0 ]; then
            echo "::error::PR นี้แตะบรรทัด vendor SheetJS ($VENDORHIT บรรทัด) — ห้ามแก้ ห้าม format ดู INVARIANTS F2"
            FAIL=1
          fi

          # ── 5. ห้ามเปลี่ยนไปโหลด library จากเน็ต (INVARIANTS F2) ──
          # แอปต้องเปิดได้ในโรงงานตอนเน็ตหลุด การเปลี่ยนไป CDN ทำให้พังเฉพาะตอนที่ต้องการใช้ที่สุด
          if git diff "$BASE...HEAD" -- '*.html' | grep -qE '^\+.*<script[^>]+src="https?://'; then
            echo "::error::PR นี้เพิ่ม <script src=\"http...\"> เข้ามา — แอปต้องเป็นไฟล์เดียวที่เปิดออฟไลน์ได้ ดู INVARIANTS F2"
            FAIL=1
          fi

          # ── 6. ห้ามให้หลักฐานจากที่ส่วนตัวหลุดเข้ามาใน repo public ──
          # workflow ของหัวหน้าทีมดึงรูปจาก nse-manufac/intake มาไว้ที่ evidence/
          # ระหว่างที่ทำงาน .gitignore กันไว้ชั้นหนึ่งแล้ว แต่ `git add -f` ข้ามได้
          # ด่านนี้คือชั้นที่ข้ามไม่ได้ เพราะเป็น required check
          if echo "$CHANGED" | grep -qE '^evidence/'; then
            echo "::error::PR นี้มีไฟล์ใน evidence/ ซึ่งเป็นรูปจากหน้างานใน repo ส่วนตัว — repo นี้เป็น public"
            echo "$CHANGED" | grep -E '^evidence/' | sed 's/^/::error::  หลุด: /'
            FAIL=1
          fi

          # ── 7. ห้ามลบเทสทิ้งทั้งไฟล์ ──
          if git diff --name-status "$BASE...HEAD" | grep -qE '^D\s+tests/'; then
            echo "::error::PR นี้ลบไฟล์เทสทิ้ง — เทสแดงแปลว่าโค้ดผิด ไม่ใช่เทสผิด"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "✓ ผ่าน — ไม่มีไฟล์ต้องห้ามถูกแตะ"
