name: ด่านกัน agent ยกระดับสิทธิ์ตัวเอง

on:
  pull_request:
    # ต้องมี labeled/unlabeled ด้วย — ด่านข้อ 4 อ่าน label เป็นเงื่อนไข
    # ถ้าไม่รันใหม่ตอนติด/ถอด label เครื่องหมายเขียวที่ค้างอยู่จะไม่ตรงกับสภาพจริงตอน merge
    # ไม่มี edited แล้ว — เคยมีตอนที่ด่านอ่านข้อความในหัว PR ตอนนี้ไม่มีด่านไหนอ่านข้อความ
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [main]

# ═══════════════════════════════════════════════════════════════
# ภัยที่กันอยู่: PR ที่แก้ไฟล์ใน .github/ สามารถเปลี่ยนสิทธิ์ของ workflow,
# ปิดการตรวจ, หรือทำให้ secret หลุดในรอบถัดไปได้
#
# หมายเหตุสำคัญ: workflow ที่รันตอน pull_request คือเวอร์ชันใน PR นั้นเอง
# แปลว่า PR ที่ "ลบไฟล์นี้ทิ้ง" จะทำให้ job นี้ไม่รัน
# ตัวที่กันจริงจึงเป็น branch protection ที่ตั้ง job นี้เป็น required check —
# ถ้า check ไม่รายงานผล ปุ่ม merge จะไม่เขียวตลอดกาล
# ═══════════════════════════════════════════════════════════════

jobs:
  guard:
    name: ตรวจสิ่งที่ agent ห้ามแตะ
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ตรวจไฟล์ที่เปลี่ยน
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HAS_VENDOR_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'vendor-change') }}
          PR_EVENT: ${{ github.event.action }}
        run: |
          set -euo pipefail
          BASE="origin/${{ github.base_ref }}"
          git fetch --quiet origin "${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE...HEAD")

          echo "PR โดย: $PR_AUTHOR   branch: $HEAD_REF"
          echo "ไฟล์ที่เปลี่ยน:"
          echo "$CHANGED" | sed 's/^/  /'
          echo ""

          FAIL=0

          # ── PR นี้มาจาก agent หรือเปล่า ────────────────────────────
          # ── ข้อจำกัดที่ต้องรู้ก่อนอ่านต่อ ────────────────────────
          # ตัวแปรนี้บอกได้แค่ "agent ที่ประกาศตัวเอง" เท่านั้น ไม่ใช่ "agent ทั้งหมด"
          #
          # agent ที่รันบนเครื่องเจ้าของใช้บัญชีเจ้าของเปิด PR ฝั่ง GitHub จึงแยกไม่ออกเลย
          # ว่าเป็นคนหรือเครื่อง — และไม่มีทางแยกออกด้วย ตราบใดที่ทั้งสองใช้บัญชีเดียวกัน
          # ของจริง 30 ส.ค. 2026 — สองก้อนใหญ่สุดของงานชุดหนึ่งเปิดด้วยบัญชีเจ้าของ
          # จึงนับเป็น "ไม่ใช่ agent" ทั้งคู่ และหลุดทั้งด่านนี้และผู้ตรวจ
          #
          # จึงห้ามใช้ตัวแปรนี้เป็นด่านสุดท้ายของอะไรที่พังแล้วเสียหายหนัก
          # ด่านจริงของเรื่องนั้นคือ required check ที่ลบทิ้งไม่ได้ + สายตาเจ้าของ
          IS_AGENT=no
          if [ "$PR_AUTHOR" = "github-actions[bot]" ] || [ "$PR_AUTHOR" = "github-actions" ]; then
            IS_AGENT=yes
          fi
          case "$HEAD_REF" in fix/*|claude/*) IS_AGENT=yes ;; esac
          echo "ถือเป็น PR ของ agent: $IS_AGENT"
          echo ""

          # ── 1. ใครก็ตามที่แตะ .github/ ต้องดังจนไม่มีทางพลาดตา ──
          # ไฟล์ในนั้นคือด่านตรวจเอง การแก้มันคือการแก้สิ่งที่ตรวจตัวเอง
          #
          # บล็อกทุกกรณีที่ "ตรวจจับได้" คือบอตเปิดเอง หรือ branch ขึ้นต้น fix/ claude/
          #   เจ้าของใช้ guard/ feat/ agent/ อยู่แล้ว เงื่อนไขชื่อ branch จึงไม่เคยขวางงานเจ้าของ
          #   และมันทำให้ด่านแรงขึ้นเท่านั้น ไม่มีทางทำให้อ่อนลง เพราะเป็นแบบอย่างใดอย่างหนึ่งก็นับ
          # ที่เหลือ = ตะโกนให้ดัง ห้ามไม่ได้เพราะเจ้าของต้องแก้ workflow ของตัวเองเป็นปกติ
          #   และแยกไม่ออกจาก agent ที่ใช้บัญชีเดียวกัน ด่านจริงคือผู้ตรวจกับสายตาเจ้าของ
          if echo "$CHANGED" | grep -q '^\.github/'; then
            if [ "$IS_AGENT" = yes ]; then
              echo "::error::PR ของ agent (โดย $PR_AUTHOR branch $HEAD_REF) แก้ไฟล์ใน .github/ — ไม่อนุญาตเด็ดขาด"
              echo "$CHANGED" | grep '^\.github/' | sed 's/^/::error::  แตะ: /'
              FAIL=1
            else
              echo "::warning::⚠️ PR ใบนี้แก้ไฟล์ด่านตรวจเอง (เปิดโดย $PR_AUTHOR)"
              echo "$CHANGED" | grep '^\.github/' | sed 's/^/::warning::  แตะ: /'
              echo "::warning::  ระบบแยกไม่ออกว่าเจ้าของแก้เอง หรือ agent ที่รันด้วยบัญชีเจ้าของ"
              echo "::warning::  ต้องอ่าน diff ส่วนนี้ด้วยตาก่อน merge ทุกครั้ง"
            fi
          fi

          # ── 2. ห้ามมี secret หลุดเข้ามาในทุก PR (repo นี้เป็น public) ──
          # ตรวจเฉพาะบรรทัดที่ "เพิ่มเข้ามา" เพื่อไม่ให้ของเก่าทำ PR ใหม่แดง
          ADDED=$(git diff "$BASE...HEAD" -- . ':(exclude)*.md' | grep '^+' || true)
          leak() {
            if printf '%s' "$ADDED" | grep -qE "$1"; then
              echo "::error::พบ $2 ในบรรทัดที่เพิ่มเข้ามา — repo นี้เป็น public"
              FAIL=1
            fi
          }
          leak 'AKfyc[A-Za-z0-9_-]{20,}'        'URL ของ Apps Script deployment'
          leak 'gh[pousr]_[A-Za-z0-9]{30,}'      'GitHub token'
          leak 'github_pat_[A-Za-z0-9_]{30,}'    'GitHub PAT'
          leak 'sk-ant-[A-Za-z0-9_-]{20,}'       'Anthropic API key'

          # ── 3. PR จาก agent ต้องเล็กพอที่จะรีวิวตอนพักเที่ยงได้ ──
          # prompt บอกช่างซ่อมไว้ว่าเกิน ~80 บรรทัดในไฟล์แอปให้หยุดถามเจ้าของก่อน
          # แต่นั่นเป็น "คำสั่ง" ซึ่ง agent เลือกไม่ทำตามได้ ด่านนี้คือเส้นที่เลือกไม่ได้
          # ตั้งไว้ 150 ไม่ใช่ 80 เพราะ 80 คือจุดที่ควรหยุดถาม ส่วน 150 คือจุดที่เลยเถิดแล้ว
          if [ "$IS_AGENT" = yes ]; then
              APPLINES=$(git diff --numstat "$BASE...HEAD" -- '*.html' | awk '{a+=$1; d+=$2} END {print (a+d)+0}')
              echo "บรรทัดที่เปลี่ยนในไฟล์แอป: $APPLINES"
              if [ "$APPLINES" -gt 150 ]; then
                echo "::error::PR จาก agent แก้ไฟล์แอปไป $APPLINES บรรทัด (เพดาน 150) — ใหญ่เกินกว่าจะตรวจตอนพักเที่ยง ต้องหยุดถามเจ้าของก่อนแก้ใหญ่ขนาดนี้"
                FAIL=1
              fi
          fi

          # ── 4. ห้ามแตะบรรทัด vendor โดยไม่ได้ตั้งใจ (INVARIANTS F2) ──
          # ไฟล์แอปเกือบทั้งไฟล์คือไลบรารีที่ vendor ไว้ในบรรทัดยาวมาก (ตอนนี้คือ ExcelJS กับ JSZip)
          # ถ้าเครื่องมือจัดรูปแบบหรือ agent เผลอแตะ diff จะบวมมหาศาลและแอปอาจพังแบบเงียบ ๆ
          # ตรวจจากความยาวบรรทัด ไม่ต้องรู้เลขบรรทัด — เลขเลื่อนได้ แต่ความยาวไม่โกหก
          # `|| true` จำเป็น — grep คืน 1 เมื่อไม่เจอ ซึ่งกับ set -e + pipefail จะทำให้ step ล้มทั้งที่ผลคือ "สะอาด"
          VENDORHIT=$(git diff -U0 "$BASE...HEAD" -- '*.html' | grep '^[+-]' | awk 'length($0)>20000' | wc -l || true)
          if [ "$VENDORHIT" -gt 0 ]; then
            # ⚠️ ด่านนี้กัน "อุบัติเหตุ" เป็นหลัก ไม่ใช่กันคนที่ตั้งใจ
            #    การเปลี่ยนหรือเพิ่มไลบรารีที่ฝังไว้เป็นเรื่องที่นาน ๆ ทีและตั้งใจทำ ห้ามขาดไม่ได้
            #    แต่ต้องประกาศไว้ในหัว PR — เพราะเครื่องมือจัดรูปแบบที่เผลอไปรีโฟลว์บรรทัด vendor
            #    ไม่มีทางเขียนคำประกาศนั้นให้ตัวเอง คำประกาศจึงแยกสองกรณีนี้ออกจากกันได้จริง
            #
            #    ของจริง 30 ส.ค. 2026 — PR ที่ฝัง JSZip เพิ่มถูกด่านนี้ตีตก และ enforce_admins
            #    ที่เพิ่งเปิดทำให้ข้ามด้วยสิทธิ์เจ้าของไม่ได้อีก ด่านที่ไม่มีทางออกจึงกลายเป็นทางตัน
            # ⚠️ ประตูคือ label ไม่ใช่ข้อความในหัว PR และไม่ใช่ IS_AGENT
            #    หัว PR — agent เขียนเองได้ระหว่างที่เขียนใบอยู่แล้ว แทบไม่ต่างจากไม่มีด่าน
            #    IS_AGENT — คอมเมนต์ข้างบนในไฟล์นี้เขียนไว้เองว่าห้ามใช้เป็นด่านสุดท้าย
            #                ของอะไรที่พังแล้วเสียหายหนัก ซึ่งไลบรารี ~925 KB คือของแบบนั้น
            #    label — เป็นการกระทำแยกต่างหาก มีชื่อคนทำและเวลาอยู่ในไทม์ไลน์ของ PR
            #
            #    ⚠️ ยังไม่ใช่ด่านที่หัก agent ที่ถือ credential ของเจ้าของได้ — มันติด label เองได้
            #    แต่ต้องเป็นการกระทำที่ตั้งใจแยกอีกครั้ง ไม่ใช่พิมพ์บรรทัดเดียวระหว่างเขียนใบ
            #    และเห็นในไทม์ไลน์ว่าใครติดเมื่อไหร่ ด่านสุดท้ายจริงคือสายตาเจ้าของ
            if [ "$IS_AGENT" = yes ]; then
              echo "::error::PR ของ agent (โดย $PR_AUTHOR branch $HEAD_REF) แตะบรรทัด vendor ($VENDORHIT บรรทัด)"
              echo "::error::  ไม่อนุญาตเด็ดขาด ต่อให้ติด label ก็ตาม — การเปลี่ยนไลบรารีเป็นเรื่องของเจ้าของ"
              FAIL=1
            elif [ "$HAS_VENDOR_LABEL" != true ]; then
              echo "::error::PR นี้แตะบรรทัด vendor ($VENDORHIT บรรทัด) — ห้ามแก้ ห้าม format ดู INVARIANTS F2"
              echo "::error::  ถ้าตั้งใจเปลี่ยนไลบรารีที่ฝังไว้จริง ให้เจ้าของติด label ชื่อ vendor-change ที่ PR ใบนี้"
              echo "::error::  แล้วเขียนในหัว PR ว่าเปลี่ยนอะไรเป็นอะไรเพราะอะไร"
              FAIL=1
            elif [ "$PR_EVENT" = synchronize ]; then
              # ⚠️ label ไม่ผูกกับ commit — ติดครั้งเดียวแล้วจะค้างอยู่ตลอดอายุ PR
              #    ถ้าไม่กันตรงนี้ พอ push อะไรตามมาทีหลัง ด่านจะปล่อยผ่านโดยไม่มีคนตัดสินใจเพิ่มอีกเลย
              #    ซึ่งขัดกับเหตุผลที่เลือกใช้ label ตั้งแต่แรก คือให้เป็นการกระทำที่มีคนและเวลากำกับ
              #    ทางออกจึงเปิดเฉพาะรอบที่คนเพิ่งลงมือ ไม่ใช่รอบที่โค้ดเพิ่งเปลี่ยน
              echo "::error::PR นี้ติด label vendor-change ไว้ แต่มีการ push โค้ดเข้ามาหลังจากนั้น"
              echo "::error::  label ที่ติดไว้เป็นการอนุมัติของ commit ก่อนหน้า ไม่ใช่ commit นี้"
              echo "::error::  ให้เจ้าของถอด label ออกแล้วติดกลับ หลังอ่าน diff ล่าสุดแล้ว"
              FAIL=1
            else
              echo "::warning::PR นี้แตะบรรทัด vendor $VENDORHIT บรรทัด และเจ้าของติด label vendor-change ให้รอบนี้"
              echo "::warning::  ต้องอ่านด้วยตาว่าเปลี่ยนไลบรารีอะไรเป็นอะไร และขนาดไฟล์เปลี่ยนไปเท่าไหร่"
            fi
          fi

          # ── 5. ห้ามเปลี่ยนไปโหลด library จากเน็ต (INVARIANTS F2) ──
          # แอปต้องเปิดได้ในโรงงานตอนเน็ตหลุด การเปลี่ยนไป CDN ทำให้พังเฉพาะตอนที่ต้องการใช้ที่สุด
          if git diff "$BASE...HEAD" -- '*.html' | grep -qE '^\+.*<script[^>]+src="https?://'; then
            echo "::error::PR นี้เพิ่ม <script src=\"http...\"> เข้ามา — แอปต้องเป็นไฟล์เดียวที่เปิดออฟไลน์ได้ ดู INVARIANTS F2"
            FAIL=1
          fi

          # ── 6. ห้ามให้หลักฐานจากที่ส่วนตัวหลุดเข้ามาใน repo public ──
          # workflow ของหัวหน้าทีมดึงรูปจาก nse-manufac/intake มาไว้ที่ evidence/
          # ระหว่างที่ทำงาน .gitignore กันไว้ชั้นหนึ่งแล้ว แต่ `git add -f` ข้ามได้
          # ด่านนี้คือชั้นที่ข้ามไม่ได้ เพราะเป็น required check
          if echo "$CHANGED" | grep -qE '^evidence/'; then
            echo "::error::PR นี้มีไฟล์ใน evidence/ ซึ่งเป็นรูปจากหน้างานใน repo ส่วนตัว — repo นี้เป็น public"
            echo "$CHANGED" | grep -E '^evidence/' | sed 's/^/::error::  หลุด: /'
            FAIL=1
          fi

          # ── 7. ห้ามลบเทสทิ้งทั้งไฟล์ ──
          if git diff --name-status "$BASE...HEAD" | grep -qE '^D\s+tests/'; then
            echo "::error::PR นี้ลบไฟล์เทสทิ้ง — เทสแดงแปลว่าโค้ดผิด ไม่ใช่เทสผิด"
            FAIL=1
          fi

          if [ "$FAIL" -eq 1 ]; then
            exit 1
          fi
          echo "✓ ผ่าน — ไม่มีไฟล์ต้องห้ามถูกแตะ"
